{% load i18n static %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block page_title %}{% endblock %} - CareerUp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'mainapp/styles.css' %}?v=ui-fix-1">
    <script src="{% static 'mainapp/theme.js' %}?v=language-labels-1&switch=3" defer></script>
</head>
<body>
    {% include "mainapp/partials/site_header.html" %}
    <main class="create-page container">
        <a href="{% url 'login' %}" class="back-link">&larr; {% translate "Back to login" %}</a>
        <section class="create-panel auth-panel">
            <span class="tag">{% translate "ACCOUNT" %}</span>
            <h1>{% block heading %}{% endblock %}</h1>
            {% block content %}{% endblock %}
        </section>
    </main>
    <script src="{% static 'mainapp/forms.js' %}"></script>
</body>
</html>
