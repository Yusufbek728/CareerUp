<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 30">
  <rect width="60" height="9" fill="#0099b5"/>
  <rect y="9" width="60" height="1" fill="#ce1126"/>
  <rect y="10" width="60" height="10" fill="#fff"/>
  <rect y="20" width="60" height="1" fill="#ce1126"/>
  <rect y="21" width="60" height="9" fill="#1eb53a"/>

  <!-- Canton: crescent and 12 stars (official layout approx.) -->
  <g id="canton">
    <!-- crescent made from two circles -->
    <circle cx="9" cy="4.5" r="3.2" fill="#fff"/>
    <circle cx="10.2" cy="4.5" r="2.6" fill="#0099b5"/>

    <!-- single normalized star path, will be reused with transforms -->
    <defs>
      <path id="star" d="M0,-1 L0.224,-0.309 L0.951,-0.309 L0.363,0.118 L0.588,0.809 L0,0.382 L-0.588,0.809 L-0.363,0.118 L-0.951,-0.309 L-0.224,-0.309 Z" />
    </defs>

    <g fill="#fff" transform="translate(0 0)">
      <!-- Top row: 3 stars -->
      <use href="#star" transform="translate(15.5 2.3) scale(0.6)" />
      <use href="#star" transform="translate(19.5 2.3) scale(0.6)" />
      <use href="#star" transform="translate(23.5 2.3) scale(0.6)" />

      <!-- Middle row: 4 stars -->
      <use href="#star" transform="translate(13 4.5) scale(0.6)" />
      <use href="#star" transform="translate(17 4.5) scale(0.6)" />
      <use href="#star" transform="translate(21 4.5) scale(0.6)" />
      <use href="#star" transform="translate(25 4.5) scale(0.6)" />

      <!-- Bottom row: 5 stars -->
      <use href="#star" transform="translate(11 6.7) scale(0.6)" />
      <use href="#star" transform="translate(14.5 6.7) scale(0.6)" />
      <use href="#star" transform="translate(18 6.7) scale(0.6)" />
      <use href="#star" transform="translate(21.5 6.7) scale(0.6)" />
      <use href="#star" transform="translate(25 6.7) scale(0.6)" />
    </g>
  </g>
</svg>
